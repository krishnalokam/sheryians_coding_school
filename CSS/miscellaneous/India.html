<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Flag</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
      }
      main {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      div {
        height: 200px;
        width: 900px;
        border: 1px solid #ccc;
        /* background: linear-gradient(#ff9933, white, #138808); */
        margin: auto;
        position: relative;
      }
      div:first-child {
        background-color: #ff9933;
      }
      div:nth-child(2) {
        background-color: #fff;
      }
      div:last-child {
        background-color: #138808;
      }
      img {
        height: 150px;
        width: 150px;
        margin: auto;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <main>
      <div></div>
      <div><img src="ashoka_chakra.png" alt="Ashoka Chakra" /></div>
      <div></div>
    </main>
  </body>
</html>
