<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Art Work Grid</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(
          circle at top left,
          #2d122c 0%,
          #0d0914 50%,
          #150e27 100%
        );
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      /* Container for the entire section */
      .marketplace-container {
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      /* Header area with Title and See All */
      .marketplace-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
      }

      .marketplace-header h2 {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .marketplace-header .see-all {
        color: #b3b3b3;
        text-decoration: none;
        font-size: 14px;
        font-weight: 400;
        transition: color 0.2s;
      }

      .marketplace-header .see-all:hover {
        color: #ffffff;
      }

      /* The main Flexbox Grid */
      .art-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        justify-content: center;
      }

      /* Card Styling */
      .art-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        padding: 20px;
        width: calc(25% - 18px); /* Calculations for 4 columns minus gap */
        min-width: 250px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        backdrop-filter: blur(10px);
      }

      /* Image Wrapper & Image */
      .image-wrapper {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 20px;
        overflow: hidden;
        background-color: #1a1523; /* Fallback background */
      }

      .image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Info Row (Title & Likes) */
      .card-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
      }

      .card-title {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
      }

      .card-likes {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: #a3a1a8;
      }

      /* Basic SVG Heart Icon */
      .heart-icon {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: #a3a1a8;
        stroke-width: 2;
      }

      /* Place Bid Button */
      .bid-btn {
        background: transparent;
        border: 2px solid #6d4494;
        color: #e2d9ee;
        border-radius: 20px;
        padding: 12px 0;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        transition: all 0.2s ease;
      }

      .bid-btn:hover {
        background: #6d4494;
        color: #ffffff;
        box-shadow: 0 0 12px rgba(109, 68, 148, 0.5);
      }

      /* Responsive scaling down for smaller screens */
      @media (max-width: 1100px) {
        .art-card {
          width: calc(50% - 12px); /* 2 columns */
        }
      }

      @media (max-width: 600px) {
        .art-card {
          width: 100%; /* 1 column */
        }
      }
    </style>
  </head>
