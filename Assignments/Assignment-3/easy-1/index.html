<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Assignment-3|easy-1|Explore At Work</title>
  </head>
  <body>
    <div class="container">
      <div class="dots">
        <div class="top_left dot"></div>
        <div class="top_right dot"></div>
        <div class="middle_left dot"></div>
        <div class="middle_right dot"></div>
        <div class="bottom bottom_left dot"></div>
        <div class="bottom bottom_right dot"></div>
      </div>
      <header><a href="#">See All</a></header>
      <main>
        <h2>Explore Art Work</h2>
        <div class="cards">
          <div class="card">
            <img src="./assets/monocular.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>Monocular</h3>
                <div>
                  <span class="value">54.8k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/horns_mask.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>Horns Mask</h3>
                <div>
                  <span class="value">32.4k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/light_moon.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>Light Moon</h3>
                <div>
                  <span class="value">88.8k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/skull_wave.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>Skull Wire</h3>
                <div>
                  <span class="value">78.9k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/spiderman.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>Spiderman</h3>
                <div>
                  <span class="value">24.8k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/deadpool.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>DeadPool</h3>
                <div>
                  <span class="value">59.7k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/white_eye.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>White Eye</h3>
                <div>
                  <span class="value">45.7k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
          <div class="card">
            <img src="./assets/plastic_spinal.png" alt="monocular eye" />
            <div class="content">
              <div class="info">
                <h3>Plastic Spinal</h3>
                <div>
                  <span class="value">95.6k</span>
                  <i class="ri-poker-hearts-line"></i>
                </div>
              </div>

              <button>Place Bid</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
