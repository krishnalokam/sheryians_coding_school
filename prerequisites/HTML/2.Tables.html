<!doctype html>
<html>
  <head>
    <title>First Web Page</title>
  </head>
  <body>
    <h1>Welcome back</h1>
    <table border="2">
      <caption>
        <b>Fruits</b>
      </caption>
      <colgroup>
        <col style="background-color: lightcoral" />
        <col style="background-color: lightcyan" />
        <col style="background-color: lightgreen" />
      </colgroup>
      <thead>
        <tr>
          <th>Name</th>
          <th>Quantity</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Mango</td>
          <td>10</td>
          <td>500</td>
        </tr>

        <tr>
          <td>Gauva</td>
          <td>5</td>
          <td>50</td>
        </tr>

        <tr>
          <td>Orange</td>
          <td>100</td>
          <td>3000</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th colspan="2">Total</th>
          <th>3550</th>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
